<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #334155;
            --card-bg: white;
            --border-color: #e2e8f0;
            --title-color: #1e3a8a;
            --subtitle-color: #64748b;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --btn-border: #cbd5e1;
            --table-hover: #f8fafc;
            --val-color: #0f172a;
            --input-border: #cbd5e1;
            --input-bg: white;
        }
        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --border-color: #334155;
            --title-color: #60a5fa;
            --subtitle-color: #94a3b8;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --btn-border: #475569;
            --table-hover: #334155;
            --val-color: #f8fafc;
            --input-border: #475569;
            --input-bg: #0f172a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            transition: background-color 0.3s, color 0.3s;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-actions {
            display: flex;
            gap: 1rem;
        }
        h1 {
            color: var(--title-color);
            margin: 0;
            transition: color 0.3s;
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            background-color: var(--btn-hover);
        }
        .card, .chart-container, .table-container, .form-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-top: 1.5rem;
            transition: background-color 0.3s;
        }
        .card { max-width: 300px; }
        .chart-container { max-width: 800px; height: 250px; position: relative; margin-top: 2rem; }
        .table-container { overflow-x: auto; margin-top: 2rem; }
        
        .card-title {
            color: var(--subtitle-color);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 0.5rem 0;
        }
        .card-value {
            color: var(--val-color);
            font-size: 2.25rem;
            font-weight: bold;
            margin: 0;
        }
        
        .modern-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .modern-table th {
            color: var(--subtitle-color);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        .modern-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .modern-table tbody tr {
            transition: background-color 0.2s ease, opacity 0.4s ease, transform 0.4s ease;
        }
        .modern-table tbody tr:hover {
            background-color: var(--table-hover);
        }
        .modern-table td:last-child, .modern-table th:last-child {
            text-align: right;
        }
        
        /* Fade Out Animation */
        .fade-out {
            opacity: 0 !important;
            transform: translateX(-20px) !important;
        }

        .form-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .form-container input {
            padding: 0.75rem;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 0.875rem;
            font-family: inherit;
            flex: 1;
            min-width: 150px;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .form-container input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-qty-plus, .btn-qty-minus {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn-qty-plus { margin-right: 8px; }
        .btn-qty-minus { margin-left: 8px; }
        .btn-qty-plus:hover, .btn-qty-minus:hover {
            background-color: var(--btn-hover);
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Responsive Design for Mobile */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .header-actions {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .btn-primary, .btn-secondary {
                width: 100%;
                text-align: center;
            }
            .card {
                max-width: 100%;
            }
            .form-container {
                flex-direction: column;
                align-items: stretch;
            }
            .chart-container {
                height: 220px;
                padding: 1rem;
                margin-top: 1rem;
            }
            .table-container {
                padding: 1rem;
                margin-top: 1rem;
            }
            .modern-table th, .modern-table td {
                padding: 0.75rem 0.5rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Dashboard</h1>
        <div class="header-actions">
            <button id="themeToggleBtn" class="btn-secondary">สลับโหมดมืด/สว่าง</button>
            <button id="downloadBtn" class="btn-primary">ดาวน์โหลดรายงาน</button>
        </div>
    </div>

    <div class="form-container">
        <input type="text" id="newProductName" placeholder="ชื่อสินค้า">
        <input type="number" id="newProductQty" placeholder="จำนวน" min="1">
        <input type="number" id="newProductPrice" placeholder="ราคา (บาท)" min="0">
        <button id="addProductBtn" class="btn-primary">เพิ่มสินค้าใหม่</button>
    </div>

    <div class="card">
        <p class="card-title">ยอดขายวันนี้</p>
        <p class="card-value" id="totalSales">฿0</p>
    </div>

    <div class="chart-container">
        <canvas id="salesChart"></canvas>
    </div>

    <div class="table-container">
        <table class="modern-table" id="salesTable">
            <thead>
                <tr>
                    <th>ชื่อสินค้า</th>
                    <th>จำนวน</th>
                    <th>ราคา</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here from API -->
            </tbody>
        </table>
    </div>
    <script>
        const ctx = document.getElementById('salesChart').getContext('2d');
        const salesChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['หนังสือเรียน', 'คีย์บอร์ด', 'เมาส์'],
                datasets: [{
                    label: 'ยอดขาย (บาท)',
                    data: [5000, 7500, 2500],
                    backgroundColor: [
                        'rgba(59, 130, 246, 0.8)',
                        'rgba(16, 185, 129, 0.8)',
                        'rgba(245, 158, 11, 0.8)'
                    ],
                    borderRadius: 6,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'สรุปยอดขายแยกตามสินค้า',
                        font: {
                            size: 16,
                            family: "'Inter', sans-serif"
                        },
                        color: '#334155',
                        padding: {
                            bottom: 20
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#e2e8f0'
                        },
                        border: {
                            display: false
                        },
                        ticks: {
                            color: '#64748b'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        border: {
                            display: false
                        },
                        ticks: {
                            color: '#64748b'
                        }
                    }
                }
            }
        });

        const API_URL = 'https://sheetdb.io/api/v1/wgknr1koznrgh';
        let dashboardData = [];

        // Fetch Data from API
        async function fetchAndRenderData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                dashboardData = data;
                renderDashboard();
            } catch (error) {
                console.error("Error fetching data:", error);
                alert("เกิดข้อผิดพลาดในการดึงข้อมูลจากเซิร์ฟเวอร์");
            }
        }

        // Render Table and Update Chart
        function renderDashboard() {
            const tableBody = document.querySelector('#tableBody');
            tableBody.innerHTML = '';
            
            let totalSales = 0;
            const chartData = [];
            const chartLabels = [];
            const chartColors = [
                'rgba(59, 130, 246, 0.8)', // blue
                'rgba(16, 185, 129, 0.8)', // green
                'rgba(245, 158, 11, 0.8)', // yellow
                'rgba(239, 68, 68, 0.8)',  // red
                'rgba(139, 92, 246, 0.8)'  // purple
            ];

            dashboardData.forEach(item => {
                const name = item.name;
                const qty = parseInt(item.quantity, 10);
                const price = parseFloat(item.price);
                
                if (!isNaN(qty) && !isNaN(price)) {
                    const rowTotal = qty * price;
                    totalSales += rowTotal;
                    chartData.push(rowTotal);
                    chartLabels.push(name);
                    
                    const formattedPrice = '฿' + price.toLocaleString('en-US');
                    const newRow = document.createElement('tr');
                    newRow.dataset.name = name;
                    newRow.innerHTML = `
                        <td>${name}</td>
                        <td><button class="btn-qty-plus">+</button><span class="qty-val">${qty}</span><button class="btn-qty-minus">-</button></td>
                        <td>${formattedPrice}</td>
                        <td><button class="btn-danger">ลบทั้งหมด</button></td>
                    `;
                    tableBody.appendChild(newRow);
                }
            });

            // Update Card
            document.getElementById('totalSales').innerText = '฿' + totalSales.toLocaleString('en-US');

            // Update Chart
            salesChart.data.labels = chartLabels;
            salesChart.data.datasets[0].data = chartData;
            salesChart.data.datasets[0].backgroundColor = chartColors.slice(0, chartData.length);
            salesChart.update();
        }

        // Fetch on load
        fetchAndRenderData();

        // Event Listener for Download Button
        document.getElementById('downloadBtn').addEventListener('click', function() {
            alert('ระบบกำลังดาวน์โหลดรายงานของคุณ...');
        });

        // Event Listener for Add Product Button (POST)
        document.getElementById('addProductBtn').addEventListener('click', async function() {
            const nameInput = document.getElementById('newProductName');
            const qtyInput = document.getElementById('newProductQty');
            const priceInput = document.getElementById('newProductPrice');

            const name = nameInput.value.trim();
            const qty = parseInt(qtyInput.value, 10);
            const price = parseFloat(priceInput.value);

            if (name && !isNaN(qty) && qty > 0 && !isNaN(price) && price >= 0) {
                const btn = this;
                btn.disabled = true;
                btn.innerText = 'กำลังเพิ่ม...';

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            data: { name: name, quantity: qty, price: price }
                        })
                    });
                    if (!response.ok) throw new Error('API Error');
                    
                    nameInput.value = '';
                    qtyInput.value = '';
                    priceInput.value = '';
                    
                    await fetchAndRenderData();
                } catch (err) {
                    console.error(err);
                    alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'เพิ่มสินค้าใหม่';
                }
            } else {
                alert('กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง');
            }
        });

        // Event delegation for table actions (PATCH / DELETE)
        document.querySelector('#salesTable').addEventListener('click', async function(e) {
            if (e.target.classList.contains('btn-danger')) {
                const row = e.target.closest('tr');
                const name = row.dataset.name;
                const btn = e.target;
                btn.disabled = true;
                btn.innerText = 'กำลังลบ...';
                
                try {
                    const response = await fetch(`${API_URL}/name/${encodeURIComponent(name)}`, {
                        method: 'DELETE',
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) throw new Error('API Error');
                    
                    row.classList.add('fade-out');
                    setTimeout(() => {
                        fetchAndRenderData();
                    }, 400);
                } catch (err) {
                    console.error(err);
                    alert('เกิดข้อผิดพลาดในการลบข้อมูล');
                    btn.disabled = false;
                    btn.innerText = 'ลบทั้งหมด';
                }
                
            } else if (e.target.classList.contains('btn-qty-minus') || e.target.classList.contains('btn-qty-plus')) {
                const row = e.target.closest('tr');
                const name = row.dataset.name;
                const qtySpan = row.querySelector('.qty-val');
                let qty = parseInt(qtySpan.innerText, 10);
                
                const isMinus = e.target.classList.contains('btn-qty-minus');
                if (isMinus) qty--;
                else qty++;
                
                const btn = e.target;
                btn.disabled = true;

                if (qty <= 0) {
                    // Delete row
                    try {
                        const response = await fetch(`${API_URL}/name/${encodeURIComponent(name)}`, {
                            method: 'DELETE',
                            headers: { 'Accept': 'application/json' }
                        });
                        if (!response.ok) throw new Error('API Error');
                        row.classList.add('fade-out');
                        setTimeout(() => {
                            fetchAndRenderData();
                        }, 400);
                    } catch (err) {
                        console.error(err);
                        alert('เกิดข้อผิดพลาดในการลบข้อมูล');
                        btn.disabled = false;
                    }
                } else {
                    // Update quantity
                    qtySpan.innerText = qty; // Optimistic update
                    try {
                        const response = await fetch(`${API_URL}/name/${encodeURIComponent(name)}`, {
                            method: 'PATCH',
                            headers: {
                                'Accept': 'application/json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                data: { quantity: qty }
                            })
                        });
                        if (!response.ok) throw new Error('API Error');
                        await fetchAndRenderData();
                    } catch (err) {
                        console.error(err);
                        alert('เกิดข้อผิดพลาดในการอัปเดตข้อมูล');
                        // Revert on error
                        btn.disabled = false;
                        if (isMinus) qty++; else qty--;
                        qtySpan.innerText = qty;
                    }
                }
            }
        });

        // Dark Mode Toggle
        document.getElementById('themeToggleBtn').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            
            const titleColor = isDark ? '#e2e8f0' : '#334155';
            const gridColor = isDark ? '#334155' : '#e2e8f0';
            const ticksColor = isDark ? '#94a3b8' : '#64748b';
            
            salesChart.options.plugins.title.color = titleColor;
            salesChart.options.scales.y.grid.color = gridColor;
            salesChart.options.scales.y.ticks.color = ticksColor;
            salesChart.options.scales.x.ticks.color = ticksColor;
            salesChart.update();
        });
    </script>
</body>
</html>
